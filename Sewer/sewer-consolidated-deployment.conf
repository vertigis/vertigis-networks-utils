# Sewer consolidated backend - Deployment Configuration
# Parameters on the command line override these values.
# VERSION: image version, for example 2.2.0
VERSION=
PORT=8080
REGISTRY=vertigisapps.azurecr.io
ACR_USER=
ACR_PASS=
CORS_ORIGIN=
# ENV_FILE: settings for the container; empty = sewer.env in the current directory, if present
ENV_FILE=
# RUNTIME: docker | podman (empty = auto-detect)
RUNTIME=
# CONTAINER_TYPE (Windows host only): linux | windows (empty = windows on Windows Server)
CONTAINER_TYPE=
MEDIA_VOLUME=sewer-media
LOGS_VOLUME=sewer-import-logs
